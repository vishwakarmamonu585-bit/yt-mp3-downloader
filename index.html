<!DOCTYPE html>
<html>
<head>
    <title>YouTube MP3 Downloader</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #ff0000; }
        input, button { padding: 12px; font-size: 16px; }
        input { width: 70%; border-radius: 30px; border: 2px solid #ddd; padding: 12px 20px; }
        button { background: #ff0000; color: white; border: none; border-radius: 30px; padding: 12px 30px; cursor: pointer; }
        button:hover { background: #cc0000; }
        .video { background: white; padding: 15px; border-radius: 12px; margin: 10px 0; display: flex; align-items: center; gap: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .video img { border-radius: 8px; width: 160px; }
        .video button { background: #25D366; }
        .video button:hover { background: #1da851; }
        #pagination { text-align: center; margin: 20px 0; }
        #pagination button { background: #333; color: white; margin: 0 5px; }
    </style>
</head>
<body>
    <h1>🎵 YouTube MP3 Downloader</h1>
    <p>YouTube Channel या Video URL डालें</p>
    <input type="text" id="urlInput" placeholder="https://youtube.com/@channelname">
    <button onclick="fetchVideos()">📥 लोड करें</button>
    <div id="videoList"></div>
    <div id="pagination"></div>

    <script>
        let allVideos = [];
        let currentPage = 1;
        const perPage = 10;

        function fetchVideos() {
            const url = document.getElementById('urlInput').value;
            if (!url) return alert('URL डालें!');
            document.getElementById('videoList').innerHTML = '⏳ लोड हो रहा...';

            fetch(`/api/get-videos?url=${encodeURIComponent(url)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    allVideos = data;
                    currentPage = 1;
                    renderPage();
                })
                .catch(err => {
                    document.getElementById('videoList').innerHTML = '❌ ' + err.message;
                });
        }

        function renderPage() {
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageVideos = allVideos.slice(start, end);

            let html = '';
            pageVideos.forEach(v => {
                html += `
                    <div class="video">
                        <img src="${v.thumbnail}" alt="thumbnail">
                        <div>
                            <strong>${v.title}</strong><br><br>
                            <button onclick="downloadMP3('${v.id}')">⬇️ MP3 320kbps</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('videoList').innerHTML = html;

            const totalPages = Math.ceil(allVideos.length / perPage);
            let paginationHtml = '';
            if (currentPage > 1) paginationHtml += `<button onclick="changePage(-1)">⬅️ Previous</button>`;
            paginationHtml += ` <span>${currentPage} / ${totalPages}</span> `;
            if (currentPage < totalPages) paginationHtml += `<button onclick="changePage(1)">Next ➡️</button>`;
            document.getElementById('pagination').innerHTML = paginationHtml;
        }

        function changePage(delta) {
            currentPage += delta;
            renderPage();
        }

        function downloadMP3(videoId) {
            alert('🎵 MP3 डाउनलोड शुरू: ' + videoId);
            window.open(`/api/download?videoId=${videoId}`);
        }
    </script>
</body>
</html>
