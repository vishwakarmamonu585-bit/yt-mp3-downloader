<!DOCTYPE html>
<html>
<head>
    <title>YouTube MP3 Downloader</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: auto; padding: 20px; text-align: center; }
        input, button { padding: 12px; font-size: 16px; width: 80%; margin: 8px 0; }
        button { background: #25D366; color: white; border: none; border-radius: 30px; cursor: pointer; width: auto; padding: 12px 30px; }
        .info { background: #f0f0f0; padding: 15px; border-radius: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🎵 YouTube MP3 Downloader</h1>
    <p>कोई भी YouTube Video URL डालें</p>
    <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=..." style="width: 90%;">
    <br>
    <button onclick="downloadMP3()">⬇️ MP3 320kbps डाउनलोड करें</button>

    <div class="info">
        <p>⚠️ यह वेबसाइट आपको <b>YouTube वीडियो पेज</b> पर रीडायरेक्ट करेगी –</p>
        <p>वहाँ से आप <b>"Save As"</b> या <b>किसी भी YouTube Downloader</b> का उपयोग करके MP3 डाउनलोड कर सकते हैं।</p>
        <p>✅ <b>सुझाव:</b> <a href="https://www.y2mate.com" target="_blank">Y2Mate</a> या <a href="https://www.ytmp3.cc" target="_blank">YTMP3</a> का उपयोग करें</p>
    </div>

    <script>
        function downloadMP3() {
            const url = document.getElementById('urlInput').value;
            if (!url) return alert('URL डालें!');

            const videoMatch = url.match(/[?&]v=([^&]+)/);
            if (!videoMatch) return alert('सही YouTube URL डालें (जैसे ...?v=abc123)');

            const videoId = videoMatch[1];
            // YouTube डायरेक्ट लिंक
            const youtubeLink = `https://www.youtube.com/watch?v=${videoId}`;
            
            // नए टैब में YouTube खोलें – वहाँ से Download करें
            window.open(youtubeLink, '_blank');
        }
    </script>
</body>
</html>
